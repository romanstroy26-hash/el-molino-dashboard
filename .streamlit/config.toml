# Цветовая тема дашборда -- взята из образца (лесная зелень, тёплое
# золото/латунь), палитра прогнана через валидатор скилла dataviz
# (CVD-безопасность, контраст, диапазон светлоты) для ОБЕИХ тем -- ниже
# используется светлая (кремовый фон, тёмный текст -- по просьбе Романа,
# приятнее глазу, чем чистый белый/чёрный), но тёмная остаётся
# доступной, если кто-то переключит тему в настройках самого Streamlit.
# Цвета фона/текста -- ТЕ ЖЕ САМЫЕ, что уже использовались в графиках
# для светлой темы (см. _TEMA_GRAFICO["light"] в dashboard.py) -- никаких
# новых непроверенных цветов, только сама тема дашборда теперь светлая
# по умолчанию, а не тёмная.
[theme]
base = "light"
primaryColor = "#B07E22"
backgroundColor = "#FBF8F2"
secondaryBackgroundColor = "#F0E7D6"
textColor = "#000000"
font = "sans serif"
