# Цветовая тема дашборда -- взята из образца (лесная зелень, тёплое
# золото/латунь, кремовый текст), палитра прогнана через валидатор
# скилла dataviz (CVD-безопасность, контраст, диапазон светлоты) для
# ОБЕИХ тем -- тёмной (основная, ниже) и светлой (на случай, если
# кто-то переключит тему в настройках самого Streamlit).
[theme]
base = "dark"
primaryColor = "#B07E22"
backgroundColor = "#16211D"
secondaryBackgroundColor = "#22332C"
textColor = "#F3EAD9"
font = "sans serif"
